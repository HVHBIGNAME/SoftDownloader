name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --all-targets --locked
      - name: Catalog tooling tests
        run: python -m unittest discover -s tools/tests -v
      - name: Validate bundled catalogs
        run: |
          cargo run --bin catalog-check --locked -- catalog/builtin.json
          python tools/catalog.py validate --catalog catalog/demo.json
      - name: Release build
        run: cargo build --release --bins --locked
      - name: Package
        run: ./tools/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SoftDownloader-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SoftDownloader-windows-x64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "SoftDownloader $GITHUB_REF_NAME"
